name: Build & deploy weather map

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      daily_years:
        description: "How many recent years the daily page covers"
        default: "5"
  schedule:
    # Rebuild every day at 05:30 UTC to pick up fresh daily values.
    - cron: "30 5 * * *"

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Generate static site
        env:
          DAILY_YEARS: ${{ github.event.inputs.daily_years || '5' }}
          THREADS: "16"
          OUTPUT_DIR: public
        run: ruby generate.rb

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
